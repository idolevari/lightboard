name: Deploy to Oxygen
description: >-
  Install dependencies and run `shopify hydrogen deploy`, then publish the
  deployment URL as an output and in the job summary. Expects the repository
  to be checked out already.

inputs:
  token:
    description: Oxygen deployment token (secrets.OXYGEN_DEPLOYMENT_TOKEN_1000130179)
    required: true
  preview:
    description: >-
      'true' adds --preview so the deploy always lands in Oxygen's Preview
      environment instead of the environment mapped to the PR head branch.
    required: false
    default: 'false'

outputs:
  url:
    description: Deployment URL read from h2_deploy_log.json
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build and deploy to Oxygen
      id: deploy
      shell: bash
      env:
        OXYGEN_TOKEN: ${{ inputs.token }}
        PREVIEW: ${{ inputs.preview }}
      run: |
        set -euo pipefail
        args=(--token "$OXYGEN_TOKEN")
        if [ "$PREVIEW" = "true" ]; then
          args+=(--preview)
        fi
        npx shopify hydrogen deploy "${args[@]}"

        url=""
        if [ -f h2_deploy_log.json ]; then
          url=$(jq -r '.url // empty' h2_deploy_log.json)
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        {
          echo "### Oxygen deployment"
          if [ -n "$url" ]; then
            echo ""
            echo "$url"
          else
            echo ""
            echo "Deployment succeeded but no URL was found in h2_deploy_log.json."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
