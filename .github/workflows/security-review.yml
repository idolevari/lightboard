name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # .github/** is intentionally NOT ignored: workflow changes are the most
    # security-sensitive diffs in the repo and must be reviewed.
    paths-ignore:
      - '**/*.md'
      - '**/*.css'
      - 'public/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: Claude security review
    # Fork and Dependabot PRs get no ANTHROPIC_API_KEY; skip instead of failing.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude security review
        # The action publishes no releases or tags; pinned to the main HEAD
        # commit of 2026-02-11 instead of the moving @main branch.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main 2026-02-11
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: 'public,scripts'
