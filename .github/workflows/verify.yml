name: Verify

# Reusable quality gate. Called by oxygen-deployment.yml before every deploy
# (production, dev, PR preview) so nothing reaches Oxygen without passing it.
# Needs no secrets, so it also runs for fork and Dependabot PRs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Codegen (Storefront/Customer Account types + React Router typegen)
        run: npm run codegen

      - name: Fail on generated-types drift
        run: |
          if ! git diff --exit-code -- '*.generated.d.ts'; then
            echo "::error::Generated GraphQL types are out of date. Run 'npm run codegen' and commit the *.generated.d.ts changes."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
